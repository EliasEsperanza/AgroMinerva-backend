version: '3.9'
services:
  # Zookeeper y Kafka
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  # === SERVICIO USUARIOS ===
  postgres_usuarios:
    image: postgres:16
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TE22003
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  servicio_usuarios:
    build: ./servicio-usuarios
    environment:
      DB_HOST: postgres_usuarios
      DB_USER: postgres
      DB_PASS: TE22003
      KAFKA_HOST: kafka
    depends_on:
      - postgres_usuarios
      - kafka
    ports:
      - "8080:8080"

  # === SERVICIO PRODUCTOS ===
  postgres_productos:
    image: postgres:16
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TE22003
    volumes:
      - productos_data:/var/lib/postgresql/data

  servicio_productos:
    build: ./servicio-productos
    environment:
      DB_HOST: postgres_productos
      DB_USER: postgres
      DB_PASS: TE22003
      KAFKA_HOST: kafka
    depends_on:
      - postgres_productos
      - kafka
    ports:
      - "8085:8080"

  # === SERVICIO INVENTARIO ===
  postgres_inventario:
    image: postgres:16
    environment:
      POSTGRES_DB: inventario_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TE22003
    volumes:
      - inventario_data:/var/lib/postgresql/data

  servicio_inventario:
    build: ./servicio-inventario
    environment:
      DB_HOST: postgres_inventario
      DB_USER: postgres
      DB_PASS: TE22003
      KAFKA_HOST: kafka
    depends_on:
      - postgres_inventario
      - kafka
    ports:
      - "8083:8080"

  # === SERVICIO VENTAS ===
  postgres_ventas:
    image: postgres:16
    environment:
      POSTGRES_DB: ventas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TE22003
    volumes:
      - ventas_data:/var/lib/postgresql/data

  servicio_ventas:
    build: ./servicio-ventas
    environment:
      DB_HOST: postgres_ventas
      DB_USER: postgres
      DB_PASS: TE22003
      KAFKA_HOST: kafka
    depends_on:
      - postgres_ventas
      - kafka
    ports:
      - "8081:8080"

  # === SERVICIO COMERCIAL ===
  postgres_comercial:
    image: postgres:16
    environment:
      POSTGRES_DB: comercial_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TE22003
    volumes:
      - comercial_data:/var/lib/postgresql/data

  servicio_comercial:
    build: ./servicio-comercial
    environment:
      DB_HOST: postgres_comercial
      DB_USER: postgres
      DB_PASS: TE22003
      KAFKA_HOST: kafka
    depends_on:
      - postgres_comercial
      - kafka
    ports:
      - "8084:8080"

  # === SERVICIO CONTENIDO ===
  postgres_contenido:
    image: postgres:16
    environment:
      POSTGRES_DB: contenido_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TE22003
    volumes:
      - contenido_data:/var/lib/postgresql/data

  servicio_contenido:
    build: ./servicio-contenido
    environment:
      DB_HOST: postgres_contenido
      DB_USER: postgres
      DB_PASS: TE22003
      KAFKA_HOST: kafka
    depends_on:
      - postgres_contenido
      - kafka
    ports:
      - "8082:8080"

volumes:
  usuarios_data:
  productos_data:
  inventario_data:
  ventas_data:
  comercial_data:
  contenido_data:
