server:
  port: 8080

spring:
  application:
    name: servicio-inventario
  datasource:
    url: jdbc:postgresql://postgres_inventario:5432/inventario_db
    username: postgres
    password: TE22003
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  cloud:
    stream:
      # La configuración de los consumidores se mantiene
      function:
        definition: manejarProductoCreado;manejarProductoEliminado;manejarVentaRegistrada
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    com.agrominerva.inventario: DEBUG
    org.springframework.kafka: DEBUG

# URL del servicio que recibirá la notificación de stock actualizado
services:
  notificaciones:
    url: http://localhost:8084/api/notificaciones # Cambia esto por la URL real