spring:
  application:
    name: servicio-ventas

  # --- Configuración de Base de Datos (PostgreSQL) ---
  datasource:
    # Conecta a la base de datos de ventas
    url: jdbc:postgresql://postgres_ventas:5432/ventas_db
    username: postgres
    password: TE22003

  # --- Configuración de JPA (Hibernate) ---
  jpa:
    hibernate:
      # 'update' es bueno para desarrollo
      ddl-auto: update
    # Muestra el SQL en la consola
    show-sql: true

  # --- Configuración de Kafka (Básica) ---
  kafka:
    # Solo necesita saber dónde está el bróker de Kafka
    bootstrap-servers: localhost:9092

server:
  port: 8080