spring:
  application:
    name: servicio-ventas

  # --- Configuración de Base de Datos (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/ventas_db
    username: postgres
    password: TE22003

  # --- Configuración de JPA (Hibernate) ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

# --- Configuración de URLs de otros servicios ---
app:
  servicios:
    inventario:
      # Si usas Docker Compose, usa el nombre del servicio
      # Ejemplo: http://servicio-inventario:8082
      url: http://localhost:8082