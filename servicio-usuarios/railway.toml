[build]
builder = "NIXPACKS"
buildCommand = "chmod +x mvnw && ./mvnw -B clean package -DskipTests"

[deploy]
startCommand = "java -jar servicio-usuarios/target/servicio-usuarios-0.0.1-SNAPSHOT.jar"
healthCheckPath = "/actuator/health"
healthCheckTimeout = 120
restartPolicyType = "ON_FAILURE"

[env]
JAVA_VERSION = "21"
SPRING_PROFILES_ACTIVE = "prod"
