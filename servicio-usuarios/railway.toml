[build]
builder = "NIXPACKS"
buildCommand = "chmod +x mvnw && ./mvnw -B clean package -DskipTests"

[deploy]
startCommand = "java -Dserver.port=$PORT -jar servicio-usuarios/target/*.jar"
healthCheckPath = "/actuator/health"
healthCheckTimeout = 120
restartPolicyType = "ON_FAILURE"

[env]
PORT = "8080"
JAVA_VERSION = "21"
SPRING_PROFILES_ACTIVE = "prod"
