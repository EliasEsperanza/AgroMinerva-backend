spring:
  application:
    name: servicio-usuarios
  datasource:
    # Conecta a la base de datos de usuarios
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # --- Configuración de JPA (Hibernate) ---
  jpa:
    hibernate:
      # 'update' es bueno para desarrollo
      ddl-auto: update
    # Muestra el SQL en la consola
    show-sql: true

  # --- Configuración de Kafka (Básica) ---
  kafka:
    # Solo necesita saber dónde está el bróker de Kafka
    bootstrap-servers: ${DB_HOST}:9092

server:
  port: 8080