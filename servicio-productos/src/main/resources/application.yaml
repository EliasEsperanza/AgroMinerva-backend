server:
  port: 8085

spring:
  application:
    name: servicio-productos
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

logging:
  level:
    com.agrominerva.productos: DEBUG

# --- Configuración de URLs de otros servicios ---
app:
  servicios:
    inventario:
      # Si usas Docker Compose, usa el nombre del servicio
      # Ejemplo: http://servicio-inventario:8082
      url: ${INVENTARIO_URL}