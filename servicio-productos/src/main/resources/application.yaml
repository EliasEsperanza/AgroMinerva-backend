server:
  port: 8085

spring:
  application:
    name: servicio-productos
  datasource:
    url: jdbc:postgresql://localhost:5432/productos_db
    username: postgres
    password: TE22003
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

logging:
  level:
    com.agrominerva.productos: DEBUG

# --- Configuración de URLs de otros servicios ---
app:
  servicios:
    inventario:
      # Si usas Docker Compose, usa el nombre del servicio
      # Ejemplo: http://servicio-inventario:8082
      url: http://localhost:8083