server:
  port: 8084

spring:
  application:
    name: servicio-comercial
  datasource:
    url: jdbc:postgresql://${RAILWAY_PRIVATE_DOMAIN}:${PGPORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  sql:
    init:
      platform: postgresql

logging:
  level:
    com.agrominerva.comercial: DEBUG
    org.hibernate.SQL: DEBUG
